# Quiet room: play, stop, check-in, dark screen. Fails if the sound takes over 3 s to start.
appId: com.stillsoundlab.still
name: Quiet room
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Rest here."
    timeout: 20000
- takeScreenshot: 01-quiet-room
- waitForAnimationToEnd
# Give the background renderer time to prepare the sound, as a person would while reading.
- swipe: { direction: UP, duration: 400 }
- swipe: { direction: DOWN, duration: 400 }
- tapOn: "Play my sound"
# The play control's label is "Getting ready" until the sound has started.
- extendedWaitUntil:
    visible: "Fade to silence"
    timeout: 3000
- takeScreenshot: 02-playing
# Let it play for a few seconds (sessions under 3 s are not recorded).
- extendedWaitUntil:
    visible: "this text never appears"
    timeout: 5000
    optional: true
- extendedWaitUntil:
    visible: "This is making it worse"
    timeout: 3000
- tapOn: "Fade to silence"
- extendedWaitUntil:
    visible: "Optional: how did that go?"
    timeout: 5000
- takeScreenshot: 03-check-in
- tapOn: "A bit easier"
- assertVisible: "Noted. Rest well."
- tapOn: "Dark screen"
- takeScreenshot: 04-dark-screen
- tapOn: "Dark screen. Tap to come back."
- extendedWaitUntil:
    visible: "Rest here."
    timeout: 5000
