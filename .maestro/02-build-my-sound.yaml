# My sound: the 30-second quick start saves, then "Tune it by ear" plays a pair and accepts a choice.
appId: com.stillsoundlab.still
name: Build my sound
---
- launchApp
- tapOn:
    id: "tab-sound"
- extendedWaitUntil:
    visible: "Make it yours"
    timeout: 10000
- takeScreenshot: 05-my-sound
# Quick start opens by default for a new person.
- tapOn: "A lot"
- tapOn: "Hiss, high sounds"
- tapOn: "Yes"
- tapOn: "Earbuds"
- scrollUntilVisible:
    element: "Choose Rain"
    direction: DOWN
    centerElement: true
- tapOn: "Choose Rain"
- takeScreenshot: 06-quick-start
- scrollUntilVisible:
    element: "Done"
    direction: DOWN
    centerElement: true
- tapOn: "Done"
- scrollUntilVisible:
    element: "Play A then B"
    direction: DOWN
    centerElement: true
- takeScreenshot: 07-tune-by-ear
- tapOn: "Play A then B"
# The play button reads "Playing…" while A and B play, then "Play again".
- extendedWaitUntil:
    visible: "Playing…"
    timeout: 8000
- extendedWaitUntil:
    visible: "Play again"
    timeout: 40000
- tapOn: "A felt calmer"
- scrollUntilVisible:
    element: "Noted. Play the next pair when you are ready."
    direction: DOWN
    centerElement: true
- takeScreenshot: 08-after-choice
