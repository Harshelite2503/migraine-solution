# Journal: the session from the quiet-room flow shows up as an episode.
appId: com.stillsoundlab.still
name: Journal
---
- launchApp
- tapOn:
    id: "tab-journal"
- extendedWaitUntil:
    visible: "Your hard days"
    timeout: 10000
- scrollUntilVisible:
    element: "Episodes \\(1\\)"
    direction: DOWN
    centerElement: true
- takeScreenshot: 09-journal
