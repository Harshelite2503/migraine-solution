# Security checks on every push and pull request (free for public repositories):
# - TruffleHog: looks for leaked keys and passwords in new commits, and fails on verified ones.
# - CodeQL: GitHub's static analysis for JavaScript and TypeScript; findings appear in the
#   repository's Security tab.
# - npm audit: known vulnerabilities in dependencies (reported, not blocking).
name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # weekly, to catch newly published vulnerabilities

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan for leaked secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: App dependencies
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit found issues in app dependencies"
      - name: Review server dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit found issues in server dependencies"
