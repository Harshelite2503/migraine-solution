# Manual check of the deployed review server: it must turn away requests that are not signed in
# (no key is built into the app any more; Supabase sign-in decides who may ask, 5 a day).
# A full review is checked from the app, signed in.
name: Review check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: still-review-fc26d0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unsigned and badly signed requests are refused
        run: |
          URL="https://$AZURE_FUNCTIONAPP_NAME.azurewebsites.net/api/review"
          A=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -X POST -H "Content-Type: application/json" --data @server/test/fixtures/sample-request.json "$URL")
          B=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -X POST -H "Authorization: Bearer not-a-real-token" -H "Content-Type: application/json" --data @server/test/fixtures/sample-request.json "$URL")
          echo "no sign-in: HTTP $A, fake sign-in: HTTP $B"
          [ "$A" = "401" ] && [ "$B" = "401" ]
