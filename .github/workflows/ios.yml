# iOS build on GitHub's macOS runners. Produces a simulator build (no Apple account needed) on every
# push to main. Building for real iPhones needs an Apple Developer account and signing secrets.
name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  ios-simulator:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install
        env: { CI: 1 }
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Still.xcworkspace -scheme Still -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 40
      - name: Package the app
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/Still-simulator.zip" Still.app
      - uses: actions/upload-artifact@v4
        with:
          name: Still-ios-simulator
          path: Still-simulator.zip
          retention-days: 14
